name: kagoroute

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kago
      POSTGRES_PASSWORD: kago
      POSTGRES_DB: kagoroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kago -d kagoroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: ./engine
    environment:
      PORT: 8080
      DATABASE_URL: postgres://kago:kago@postgres:5432/kagoroute
      REDIS_URL: redis://redis:6379
      # Dev-only secret. Callbacks must send `X-KagoRoute-Key: dev_secret_change_me`.
      USSD_CALLBACK_SECRET: dev_secret_change_me
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      USSD_MAX_BODY_BYTES: 4096
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_ENGINE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - engine

volumes:
  pgdata:
