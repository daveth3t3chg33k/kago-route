[package]
name = "kagoroute-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KagoRoute USSD/SMS integration engine (Axum + Tokio)"

[dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
